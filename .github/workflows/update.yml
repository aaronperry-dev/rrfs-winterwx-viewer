name: Update RRFS winter dashboard

# RRFS / REFS cycles run at 00, 06, 12 and 18 UTC.  A run starts a few hours after each cycle, and again one and two hours
# later in case the 60-hour forecast was not complete yet.  A run that finds the live site already showing the newest complete
# cycle exits after ~1 minute without touching Pages (see --skip-if-deployed).
on:
  schedule:
    - cron: "50 3,9,15,21 * * *"
    - cron: "30 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the live site already shows the newest cycle"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write               # keep-alive step only

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Natural Earth 1:10m boundaries (~40 MB, downloaded once, then cached) and the native->display grid mapping (~15 MB).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/cartopy
            .cache
          key: static-v1-${{ hashFiles('rrfs_viewer/config.py', 'rrfs_viewer/basemap.py') }}
          restore-keys: static-v1-

      - name: Build site
        id: build
        env:
          FORCE: ${{ inputs.force }}
        run: |
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          skip=(--skip-if-deployed "$pages_url")
          [ "$FORCE" = "true" ] && skip=()
          python -m rrfs_viewer.build --out public --cache .cache "${skip[@]}"
          if [ -f public/index.html ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish == 'true'
        with:
          path: public

      # GitHub pauses scheduled workflows in a public repository after 60 days without repository activity.
      # Best effort: re-enabling the workflow through the API resets that timer.
      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
